<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021414"/>
      <stop offset="50%" stop-color="#062e28"/>
      <stop offset="100%" stop-color="#081e3a"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#cyberBg)"/>

  <!-- Matrix HUD Grid lines -->
  <line x1="0" y1="225" x2="800" y2="225" stroke="rgba(0, 255, 136, 0.15)" stroke-width="1" stroke-dasharray="8 8"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="rgba(0, 255, 136, 0.15)" stroke-width="1" stroke-dasharray="8 8"/>
  
  <!-- Cyber Target Reticle & Mecha Wings Motif -->
  <g filter="url(#glowGreen)">
    <circle cx="400" cy="180" r="85" fill="none" stroke="url(#neonGreen)" stroke-width="3"/>
    <circle cx="400" cy="180" r="105" fill="none" stroke="url(#neonGreen)" stroke-width="1.5" stroke-dasharray="25 15"/>
    
    <!-- Crosshairs -->
    <line x1="330" y1="180" x2="380" y2="180" stroke="#00ff88" stroke-width="3"/>
    <line x1="420" y1="180" x2="470" y2="180" stroke="#00ff88" stroke-width="3"/>
    <line x1="400" y1="110" x2="400" y2="160" stroke="#00ff88" stroke-width="3"/>
    <line x1="400" y1="200" x2="400" y2="250" stroke="#00ff88" stroke-width="3"/>

    <!-- Mecha Chevron Wings -->
    <path d="M260,200 L320,150 L340,165 L290,210 Z" fill="url(#neonGreen)"/>
    <path d="M540,200 L480,150 L460,165 L510,210 Z" fill="url(#neonGreen)"/>
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">CYBER VANGUARD</text>
  <text x="400" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="3">STEEL HORIZON • TACTICAL RTS</text>
</svg>
