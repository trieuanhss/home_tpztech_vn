<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2c"/>
      <stop offset="50%" stop-color="#3b156b"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#skyBg)"/>

  <!-- Floating Island & Airship Crystal -->
  <g filter="url(#purpleGlow)">
    <!-- Central Floating Diamond Crystal -->
    <polygon points="400,60 460,160 400,260 340,160" fill="url(#crystalGrad)" opacity="0.85"/>
    <polygon points="400,80 435,160 400,240 365,160" fill="#ffffff" opacity="0.4"/>

    <!-- Orbital Energy Waves -->
    <ellipse cx="400" cy="180" rx="140" ry="40" fill="none" stroke="rgba(244, 114, 182, 0.5)" stroke-width="2.5" transform="rotate(-15 400 180)"/>
    <ellipse cx="400" cy="180" rx="180" ry="50" fill="none" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" stroke-dasharray="15 10" transform="rotate(10 400 180)"/>

    <!-- Mini satellite crystal shards -->
    <polygon points="260,140 275,165 260,190 245,165" fill="#f472b6"/>
    <polygon points="530,120 545,145 530,170 515,145" fill="#38bdf8"/>
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">MYSTIC SKY REALMS</text>
  <text x="400" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f472b6" text-anchor="middle" letter-spacing="3">AIRBORNE QUEST • CO-OP SURVIVAL</text>
</svg>
