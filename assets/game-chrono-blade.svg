<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Energy rings in background -->
  <circle cx="400" cy="225" r="180" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" stroke-dasharray="10 15"/>
  <circle cx="400" cy="225" r="130" fill="none" stroke="rgba(129, 140, 248, 0.25)" stroke-width="3"/>
  <circle cx="400" cy="225" r="80" fill="none" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Cyber Katana / Blade Silhouette -->
  <g filter="url(#glow)">
    <!-- Sword blade glow -->
    <path d="M180,380 L390,160 Q410,135 440,110 L445,115 Q420,145 405,175 L200,395 Z" fill="url(#bladeGrad)"/>
    <!-- Blade core bright white line -->
    <path d="M190,385 L420,135" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Hilt / Tsuba -->
    <rect x="175" y="375" width="40" height="12" rx="4" transform="rotate(-45 195 381)" fill="#38bdf8"/>
    <!-- Pommel energy burst -->
    <circle cx="160" cy="415" r="12" fill="#818cf8" fill-opacity="0.8"/>
  </g>

  <!-- Typography overlay -->
  <text x="400" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">CHRONO BLADE</text>
  <text x="400" y="305" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="3">THE LOST LEGENDS • ARPG</text>
</svg>
