<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fireBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180505"/>
      <stop offset="50%" stop-color="#3d0e07"/>
      <stop offset="100%" stop-color="#1c0717"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#fireBg)"/>

  <!-- Eclipse / Dark Sun Motif -->
  <g filter="url(#fireGlow)">
    <!-- Fiery Corona -->
    <circle cx="400" cy="180" r="90" fill="url(#fireGrad)"/>
    <!-- Black Eclipse Moon Core -->
    <circle cx="400" cy="180" r="76" fill="#0f0303"/>

    <!-- Dark Souls-like Greatsword Silhouette thrusting downwards through eclipse -->
    <path d="M394,40 L406,40 L405,270 L400,285 L395,270 Z" fill="#fbbf24"/>
    <!-- Crossguard -->
    <rect x="365" y="80" width="70" height="10" rx="3" fill="#f97316"/>
    <!-- Sword tip embers -->
    <circle cx="400" cy="285" r="4" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="400" y="335" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">SHADOW DOMINION</text>
  <text x="400" y="370" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="3">DARK ODYSSEY • SOULS-LIKE ACTION</text>
</svg>
